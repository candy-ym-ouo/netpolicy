<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NetPolicy Validator</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>NetPolicy Validator</h1><nav><button data-view="dashboard">概览</button><button data-view="rules">规则</button><button data-view="analysis">分析</button><button data-view="checks">检查</button></nav></header><main><section id="dashboard" class="view"><h2>网络策略概览</h2><div id="stats" class="cards"></div></section><section id="rules" class="view hidden"><h2>导入规则</h2><textarea id="ruleData" rows="8" placeholder='[{"id":"r1","src":"10.0.0.0/24","dst":"172.16.0.0/16","action":"allow","protocol":"tcp","portFrom":443,"portTo":443}]'></textarea><button id="import">导入 JSON</button><pre id="importResult"></pre><h2>规则列表</h2><div id="rulesList"></div></section><section id="analysis" class="view hidden"><h2>可达性分析</h2><input id="src" value="10.0.0.1"><input id="dst" value="172.16.0.1"><input id="port" value="443"><button id="reach">查询</button><pre id="analysisResult"></pre></section><section id="checks" class="view hidden"><h2>完整检查</h2><button id="check">运行检查</button><pre id="checkResult"></pre></section></main><script src="/app.js"></script></body></html>
